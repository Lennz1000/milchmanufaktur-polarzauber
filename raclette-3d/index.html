<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120c08">
<title>Raclette-Hütte 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* r2 (Lenny: "just white with text ... zero design"): an evening-market stage. The model IS the page (full-bleed), lit like a
   stall at dusk: a warm amber glow behind the huts falling off into espresso dark; chrome floats on dark smoked glass; the
   Milchmanufaktur logo leads the header. System type (SF on Apple devices) with tight display tracking. */
:root {
  --stage: #120c08;                      /* espresso night */
  --glow: #6b4426;                       /* warm lantern glow behind the huts */
  --ink: #f7f2ec;
  --ink-2: #c3b5a6;
  --glass: rgba(34, 24, 17, .55);
  --glass-edge: rgba(255, 236, 214, .14);
  --shadow: 0 12px 40px rgba(0, 0, 0, .35), 0 1px 2px rgba(0, 0, 0, .3);
  --red: #ff453a;                        /* system red (dark): "Höhe geschätzt" must be noticed */
  --milch: #7fc8ec;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--stage); color: var(--ink); font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  overflow: hidden; overscroll-behavior: none; }

model-viewer { position: fixed; inset: 0; width: 100%; height: 100%;
  background: radial-gradient(70% 55% at 50% 48%, var(--glow) 0%, #3a2516 38%, var(--stage) 78%);
  --poster-color: transparent; touch-action: none; -webkit-user-select: none; user-select: none; outline: none; }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-edge); box-shadow: var(--shadow); }

header.bar { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 12px); width: min(560px, calc(100% - 24px));
  border-radius: 22px; padding: 10px 16px 10px 10px; display: flex; align-items: center; gap: 12px; }
header.bar img { width: 46px; height: 46px; border-radius: 50%; flex: none; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
.titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
h1 { margin: 0; font: 700 clamp(1.3rem, 3.2vw, 1.7rem)/1.05 var(--display); letter-spacing: -.028em; }
.sub { font-size: .74rem; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

.specs { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: min(560px, calc(100% - 24px));
  border-radius: 18px; padding: 8px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.spec { padding: 8px 10px; border-radius: 12px; background: rgba(255, 244, 232, .06); min-width: 0; }
.spec .k { font-size: .68rem; color: var(--ink-2); letter-spacing: .02em; }
.spec .v { font: 600 .84rem/1.25 var(--font); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.spec.guess { background: rgba(255, 69, 58, .16); box-shadow: inset 0 0 0 1px rgba(255, 69, 58, .45); }
.spec.guess .v { color: var(--red); }
@media (max-width: 520px) { .specs { grid-template-columns: repeat(2, 1fr); } }

.hint { position: fixed; z-index: 2; left: 50%; transform: translate(-50%, 0);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px + var(--specs-h, 92px));
  border-radius: 999px; padding: 8px 14px 8px 10px; display: flex; align-items: center; gap: 8px;
  font: 500 .8rem/1 var(--font); white-space: nowrap; pointer-events: none;
  transition: opacity .45s ease, transform .45s cubic-bezier(.2, .8, .2, 1); }
.hint svg { width: 18px; height: 18px; flex: none; }
.hint.gone { opacity: 0; transform: translate(-50%, 8px); }

@media (prefers-reduced-transparency: reduce) { .glass { background: #241a12; -webkit-backdrop-filter: none; backdrop-filter: none; } }
@media (prefers-reduced-motion: reduce) { .hint { transition: opacity .2s ease; } }
</style>
</head><body>

<model-viewer id="mv" src="stand-4.json" alt="3D-Modell der zwei Raclette-Hütten mit Rückwand, Seitenwänden, Frontgiebeln und Theke"
  camera-controls touch-action="none" camera-orbit="0deg 80deg 15m" camera-target="3.18m 1.2m -0.9m" interpolation-decay="50"
  min-camera-orbit="auto 20deg 1.5m" max-camera-orbit="auto 98deg 18m" field-of-view="auto"
  shadow-intensity="1.2" shadow-softness=".7" exposure="0.95" tone-mapping="neutral" environment-image="neutral" interaction-prompt="none"></model-viewer>

<header class="bar glass">
  <img src="logo.webp" alt="Milchmanufaktur Einsiedeln">
  <div class="titles"><h1>Raclette-Hütte</h1><span class="sub">Milchmanufaktur Einsiedeln</span></div>
</header>

<div class="hint glass" id="hint" aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.9-2.5L4.3 15a1.5 1.5 0 0 1 2.3-1.9L9 15"/>
  </svg>
  <span>Ziehen zum Drehen · zwei Finger zum Zoomen</span>
</div>

<section class="specs glass" id="specs" aria-label="Masse">
  <div class="spec"><div class="k">Rückwand</div><div class="v">6360 × 2400 mm</div></div>
  <div class="spec"><div class="k">Seitenwände</div><div class="v">2030 × 990 mm</div></div>
  <div class="spec"><div class="k">Frontgiebel</div><div class="v">2 × 3030 × 430</div></div>
  <div class="spec guess"><div class="k">Theke</div><div class="v">Höhe geschätzt</div></div>
</section>

<script>
/* The hint sits above the spec card and fades out on the first touch. */
(() => {
  const specs = document.getElementById('specs'), hint = document.getElementById('hint'), mv = document.getElementById('mv');
  const fit = () => document.documentElement.style.setProperty('--specs-h', specs.offsetHeight + 'px');
  fit(); addEventListener('resize', fit);
  const hide = () => hint.classList.add('gone');
  ['pointerdown', 'wheel', 'touchstart'].forEach(ev => mv.addEventListener(ev, hide, { once: true, passive: true }));
})();
/* Default camera move r3 (Lenny 2026-11-26, his screenshot = the close-up): full front, zoomed out (whole stand) ->
   zoom in to eye height on the left hut -> glide sideways to the right (no bobbing), camera turning right with it ->
   zoom out to the full front again -> repeat. Catmull-Rom spline through the keys, so speed never drops to zero:
   one continuous flow, no start-stop. Any touch takes over; after 10 s idle it glides back into the path. */
(() => {
  const mv = document.getElementById('mv');
  const D = Math.PI / 180;
  //        time   theta  phi   radius  target x  y     z
  const K = [[0,     0,   80,   15.0,   3.18,   1.20, -0.9],    // full front, everything in view
             [6,   -14,   86,    5.6,   1.55,   1.30, -0.95],   // close as his screenshot: bar fills the frame, eye height
             [12.5,  0,   86,    5.8,   3.18,   1.30, -0.95],   // gliding right through the middle
             [19,   16,   86,    5.6,   4.80,   1.30, -0.95],   // right hut, camera turned right
             [25,    0,   80,   15.0,   3.18,   1.20, -0.9]];   // back out to the full front (= first key)
  const P = K[K.length - 1][0];
  const keys = K.slice(0, -1), n = keys.length;
  function at(t) {                                            // periodic Catmull-Rom on every channel
    t = ((t % P) + P) % P;
    let i = 0; while (i < n - 1 && t >= keys[i + 1][0]) i++;
    const t0 = keys[i][0], t1 = i + 1 < n ? keys[i + 1][0] : P, u = (t - t0) / (t1 - t0);
    const k = j => keys[((j % n) + n) % n];
    const p0 = k(i - 1), p1 = k(i), p2 = k(i + 1), p3 = k(i + 2), o = [];
    for (let c = 1; c < 7; c++) {
      const a = p0[c], b = p1[c], cc = p2[c], d = p3[c];
      o.push(0.5 * ((2 * b) + (-a + cc) * u + (2 * a - 5 * b + 4 * cc - d) * u * u + (-a + 3 * b - 3 * cc + d) * u * u * u));
    }
    return { th: o[0], phi: o[1], r: o[2], tx: o[3], ty: o[4], tz: o[5] };
  }
  function apply(p) {
    mv.cameraTarget = `${p.tx.toFixed(3)}m ${p.ty.toFixed(3)}m ${p.tz.toFixed(3)}m`;
    mv.cameraOrbit = `${p.th.toFixed(2)}deg ${p.phi.toFixed(2)}deg ${p.r.toFixed(3)}m`;
    mv.jumpCameraToGoal();
  }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { mv.addEventListener('load', () => apply(at(0)), { once: true }); return; }
  const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t), lerp = (a, b, t) => a + (b - a) * t;
  let raf = 0, start = 0, offset = 0, from = null, blendT0 = 0, idle = null;
  const BLEND = 2.5;
  function frame(now) {
    const t = offset + (now - start) / 1000;
    let p = at(t);
    if (from) {
      const k = ease((now - blendT0) / 1000 / BLEND);
      const q = {}; for (const key in p) q[key] = lerp(from[key], p[key], k); p = q;
      if (k >= 1) from = null;
    }
    apply(p); raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; offset += (performance.now() - start) / 1000; }
    clearTimeout(idle); idle = setTimeout(resume, 10000);
  }
  function resume() {
    const o = mv.getCameraOrbit(), g = mv.getCameraTarget();
    let th = o.theta / D; th = ((th + 180) % 360 + 360) % 360 - 180;
    from = { th, phi: o.phi / D, r: o.radius, tx: g.x, ty: g.y, tz: g.z };
    start = blendT0 = performance.now(); raf = requestAnimationFrame(frame);
  }
  mv.addEventListener('load', () => { apply(at(0)); start = performance.now(); raf = requestAnimationFrame(frame); }, { once: true });
  ['pointerdown', 'wheel', 'touchstart'].forEach(ev => mv.addEventListener(ev, stop, { passive: true }));
})();
</script>
</body></html>
