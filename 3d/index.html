<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' data: blob:; worker-src blob:; form-action 'none'; base-uri 'none';"><title>Polarzauber 2026 · 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --bg:#f6f3ed; --ink:#191714; --mut:#767068; --mat:#ece7de; --ac:#8a6b3f;
  --stage:#0d1424;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:1rem/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}

.page{min-height:100%;display:flex;flex-direction:column;gap:clamp(.75rem,2vw,1.1rem);
  max-width:1200px;margin:0 auto;
  padding:clamp(.9rem,2.5vw,1.4rem) max(1rem,env(safe-area-inset-left,0px)) 2rem max(1rem,env(safe-area-inset-right,0px))}

header{display:flex;align-items:baseline;gap:1rem}
.back{font-size:.9375rem;color:var(--ac);text-decoration:none;border-radius:8px}
.back:hover{text-decoration:underline;text-underline-offset:3px}
.back:focus-visible{outline:2px solid var(--ac);outline-offset:4px}
h1{margin:0 0 0 auto;font-size:.8125rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}

model-viewer{width:100%;flex:1;min-height:22rem;height:min(70vh,46rem);border-radius:16px;
  background:radial-gradient(120% 90% at 50% 30%,#1d2a49 0%,var(--stage) 70%);--poster-color:transparent}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem .9rem}
.bar .lbl{font-size:.8125rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font:inherit;font-size:.9375rem;color:var(--ink);background:var(--mat);border:0;
  border-radius:999px;padding:.5rem 1rem;cursor:pointer;
  transition:transform .1s var(--ease),background .2s var(--ease),color .2s var(--ease)}
.chip:active{transform:scale(.95)}
@media (hover:hover){.chip:hover{background:#e3ddd2}}
.chip[aria-pressed="true"]{background:var(--ink);color:#f6f3ed}
.chip:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.hint{margin-left:auto;font-size:.8125rem;color:var(--mut)}

@media (max-width:640px){.hint{margin-left:0;width:100%}model-viewer{height:58vh}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style></head><body>

<div class="page">
  <header><a class="back" href="../">← Übersicht</a><h1>Polarzauber 2026</h1></header>

  <model-viewer id="mv" src="stand.json" alt="3D-Modell des Marktstands mit der Innenauskleidung"
    camera-controls touch-action="pan-y" camera-orbit="-15deg 80deg auto" min-camera-orbit="auto 20deg auto"
    max-camera-orbit="auto 98deg 11m" field-of-view="auto" shadow-intensity="1" exposure="1.05"
    interaction-prompt="none"></model-viewer>

  <div class="bar">
    <span class="lbl">Giebel</span>
    <div class="chips" role="group" aria-label="Giebel vorne">
      <button class="chip" data-tex="g_magronen.webp" aria-pressed="true">Älpler Magronen</button>
      <button class="chip" data-tex="g_landschaft.webp" aria-pressed="false">Landschaft</button>
      <button class="chip" data-tex="g_logo.webp" aria-pressed="false">Mit Logo</button>
    </div>
    <span class="hint">Ziehen zum Drehen, zwei Finger zum Zoomen</span>
  </div>
</div>

<script>
const mv = document.getElementById('mv');
const chips = [...document.querySelectorAll('.chip')];
const cache = {};
async function setGable(file) {
  const mat = mv.model && mv.model.materials.find(m => m.name === 'print_gable_mag');
  if (!mat) return;
  cache[file] = cache[file] || mv.createTexture(file);
  mat.pbrMetallicRoughness.baseColorTexture.setTexture(await cache[file]);
}
chips.forEach(b => b.addEventListener('click', () => {
  chips.forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  setGable(b.dataset.tex);
}));
</script></body></html>
