<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Polarzauber Stand 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Layout: one night-sky stage, the stall fills it; a quiet strip below picks the front gable. Single dark look (winter night, Polarzauber). */
:root {
  --night: #0d1424;      /* stage ground, the gable sky */
  --night-2: #16203a;    /* chip ground */
  --snow: #eef2f7;       /* text */
  --frost: #9aa8bf;      /* secondary text */
  --milch: #8fd0ee;      /* Milchmanufaktur light blue, selection */
  --glow: #f2c46d;       /* fairy-light gold, focus */
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--snow); font-family: var(--body); }
.page { min-height: 100%; display: flex; flex-direction: column; gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 22px;
  max-width: 1200px; margin: 0 auto; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(1.4rem, 3.4vw, 2rem); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.who { font-size: .8rem; color: var(--frost); letter-spacing: .08em; text-transform: uppercase; }
model-viewer { width: 100%; height: min(72vh, 760px); min-height: 380px; border-radius: 6px;
  background: radial-gradient(120% 90% at 50% 30%, #1d2a49 0%, var(--night) 70%); --poster-color: transparent; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.bar .lbl { font-size: .8rem; color: var(--frost); letter-spacing: .08em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 .92rem var(--body); color: var(--snow); background: var(--night-2); border: 1px solid #2a3758;
  border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--milch); color: var(--night); border-color: var(--milch); }
.chip:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.hint { margin-left: auto; font-size: .82rem; color: var(--frost); }
@media (max-width: 560px) { .hint { margin-left: 0; width: 100%; } model-viewer { height: 62vh; } }
</style>

<div class="page">
  <header><a href="../" style="color:var(--frost);font-size:.85rem;text-decoration:none">← Übersicht</a>
    <h1>Polarzauber 2026</h1>
    <span class="who">Milchmanufaktur Einsiedeln</span>
  </header>

  <model-viewer id="mv" src="stand.json" alt="3D-Modell des Marktstands mit der Innenauskleidung"
    camera-controls touch-action="pan-y" camera-orbit="-15deg 80deg auto" min-camera-orbit="auto 20deg auto"
    max-camera-orbit="auto 98deg 11m" field-of-view="auto" shadow-intensity="1" exposure="1.05"
    interaction-prompt="none"></model-viewer>

  <div class="bar">
    <span class="lbl">Giebel vorne</span>
    <div class="chips" role="group" aria-label="Giebel vorne">
      <button class="chip" id="g-magronen" data-tex="g_magronen.webp" aria-pressed="true">Älpler Magronen</button>
      <button class="chip" id="g-landschaft" data-tex="g_landschaft.webp" aria-pressed="false">Landschaft</button>
      <button class="chip" id="g-logo" data-tex="g_logo.webp" aria-pressed="false">Mit Logo</button>
    </div>
    <span class="hint">Ziehen zum Drehen · zwei Finger zum Zoomen</span>
  </div>
</div>

<script>
const mv = document.getElementById('mv');
const chips = [...document.querySelectorAll('.chip')];
const cache = {};
async function setGable(file) {
  const mat = mv.model && mv.model.materials.find(m => m.name === 'print_gable_mag');
  if (!mat) return;
  cache[file] = cache[file] || mv.createTexture(file);
  mat.pbrMetallicRoughness.baseColorTexture.setTexture(await cache[file]);
}
chips.forEach(b => b.addEventListener('click', () => {
  chips.forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  setGable(b.dataset.tex);
}));
</script>
</html>
